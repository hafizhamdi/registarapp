{% extends "registarapp/main.html" %} {% block title %}Dashboard | School
Portal{% endblock %} {% block content %}
<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-bold text-gray-800">Edit Student Information</h2>
  <!-- FIXED: Added @click to the main button -->
</div>
<div>
  <form action="{% url 'create_student' %}" method="POST" class="p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="col-span-2">
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Student Name</label
        >
        <input
          type="text"
          name="full_name"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>                                                 
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >ID Number</label
        >
        <input
          type="text"
          name="nric"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >ID Type</label
        >
        <select
          name="id_type"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>MyKad</option>
          <option>Passport</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Date of Birth</label
        >
        <input
          type="date"
          name="dob"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Gender</label
        >
        <select
          name="gender"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Age</label
        >
        <input
          type="number"
          name="age"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Student Type</label
        >
        <select
          name="student_type"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>Full-time</option>
          <option>Part-time</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Address Line 1</label
        >
        <input
          type="text"
          name="addrline1"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Address Line 2</label
        >
        <input
          type="text"
          name="addrline2"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Postcode</label
        >
        <input
          type="text"
          name="postcode"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >City</label
        >
        <input
          type="text"
          name="city"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >State</label
        >
        <input
          type="text"
          name="state"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Country</label
        >
        <input
          type="text"
          name="country"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Previous School</label
        >
        <input
          type="text"
          name="prevSchool"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Total Siblings</label
        >
        <input
          type="number"
          name="noOfSiblings"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Number In Siblings</label
        >
        <input
          type="number"
          name="noInSiblings"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Parent Name</label
        >
        <input
          type="text"
          name="parentName"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Relationship</label
        >
        <select
          name="student_type"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>Close relative</option>
          <option>Father</option>
          <option>Mother</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Parent Contact</label
        >
        <input
          type="number"
          name="parentContact"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-6">
      <button
        type="button"
        @click="open = false"
        class="px-4 py-2 text-gray-500"
      >
        Cancel
      </button>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
        Save
      </button>
    </div>
  </form>
</div>
{% endblock %}
