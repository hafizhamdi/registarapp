{% extends "registarapp/main.html" %} {% block title %}Dashboard | School
Portal{% endblock %} {% block content %}
<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-bold text-gray-800">Edit Student Information</h2>
  <!-- FIXED: Added @click to the main button -->
</div>
<div>
  <form action="{% url 'edit_student' student.id %}" method="POST" class="p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="col-span-2">
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Student Name</label
        >
        <input
          type="text"
          name="full_name"
          value="{{student.full_name}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>                                                 
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >ID Number</label
        >
        <input
          type="text"
          name="nric"
          value="{{student.id_number}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >ID Type</label
        >
        <select
          name="id_type"
          value="{{student.id_type}}"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>MyKad</option>
          <option>Passport</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Date of Birth</label
        >
        <input
          type="date"
          name="dob"
          value="{{student.dob|date:'Y-m-d'}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Gender</label
        >
        <select
          name="gender"
          value="{{student.gender}}"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Age</label
        >
        <input
          type="number"
          name="age"
          value="{{student.age}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Student Type</label
        >
        <select
          name="student_type"
          value="{{student.student_type}}"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>Full-time</option>
          <option>Part-time</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Address Line 1</label
        >
        <input
          type="text"
          name="address_line1"
          value="{{student.address_line1}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Address Line 2</label
        >
        <input
          type="text"
          name="address_line2"
          value="{{student.address_line2}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Postcode</label
        >
        <input
          type="text"
          name="postcode"
          value="{{student.postcode}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >City</label
        >
        <input
          type="text"
          name="city"
          value="{{student.city}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >State</label
        >
        <input
          type="text"
          name="state"
          value="{{student.state}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Country</label
        >
        <input
          type="text"
          name="country"
          value="{{student.country}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Previous School</label
        >
        <input
          type="text"
          name="previous_school"
          value="{{student.previous_school}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Total Siblings</label
        >
        <input
          type="number"
          name="total_siblings"
          value="{{student.total_siblings}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Number In Siblings</label
        >
        <input
          type="number"
          name="number_of_children"
          value="{{student.number_of_children}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Parent Name</label
        >
        <input
          type="text"
          name="parent_name"
          value="{{student.parent_name}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Relationship</label
        >
        <select
          name="relationship"
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
          <option>Close relative</option>
          <option>Father</option>
          <option>Mother</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase mb-1"
          >Parent Contact</label
        >
        <input
          type="number"
          name="parent_contact"
          value="{{student.parent_contact}}"
          required
          class="block w-full pl-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-6">
      <a
        href="{% url 'registration_student' %}"
        class="px-4 py-2 text-gray-500 hover:text-gray-700 inline-block text-sm"
        
        >
        Cancel
        </a>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
        Save
      </button>
    </div>
  </form>
</div>
{% endblock %}
