<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think Ummah</title>
    <link href="../static/css/output.css" rel="stylesheet">
    <!-- Using CDN as fallback to ensure styles load for testing -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script defer src="../static/js/alpine.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Mobile Header -->
    <header class="flex items-center justify-between bg-white p-4 shadow sm:hidden">
        <button id="drawerToggle" class="text-gray-500 focus:outline-none">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
        <span class="font-bold text-xl">Registar Portal</span>
    </header>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 -translate-x-full transform bg-gray-900 border-r border-gray-800 transition-transform duration-300 ease-in-out sm:static sm:translate-x-0">
            <div class="flex h-20 items-center justify-center bg-gray-950 text-white">
                <h1 class="text-2xl font-bold tracking-tight">Registar Portal</h1>
            </div>
            
            <nav class="mt-5 px-4">
                <ul class="space-y-2">
                    <li>
                        <a href="{% url 'dashboard' %}" 
                            class="flex items-center rounded-lg p-3 transition-colors 
                                {% if request.resolver_match.url_name == 'dashboard' %} bg-gray-800 text-white {% else %} text-gray-400 hover:text-white hover:bg-gray-800 {% endif %}">
                            <span class="font-medium">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'registration_student' %}" 
                         class="flex items-center rounded-lg p-3 transition-colors 
                                {% if request.resolver_match.url_name == 'registration_student' %} bg-gray-800 text-white {% else %} text-gray-400 hover:text-white hover:bg-gray-800 {% endif %}">
                        <span class="font-medium">Student Registration</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'bill_payment' %}"  
                         class="flex items-center rounded-lg p-3 transition-colors 
                                {% if request.resolver_match.url_name == 'bill_payment' %} bg-gray-800 text-white {% else %} text-gray-400 hover:text-white hover:bg-gray-800 {% endif %}">
                        <span class="font-medium">Bill and Payment</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center rounded-lg p-3 text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                            <span class="font-medium">Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside> <!-- FIXED: Was missing closing tag -->

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-6">
            <!-- Message Toast Notification -->
            <div class="fixed top-5 right-5 z-[100] space-y-3">
                {% if messages %}
                    {% for message in messages %}
                        <div x-data="{ show: true }" 
                            x-show="show" 
                            x-init="setTimeout(() => show = false, 4000)"
                            x-transition:enter="transition ease-out duration-300"
                            x-transition:enter-start="translate-x-full opacity-0"
                            x-transition:enter-end="translate-x-0 opacity-100"
                            x-transition:leave="transition ease-in duration-300"
                            x-transition:leave-start="opacity-100"
                            x-transition:leave-end="opacity-0"
                            class="flex items-center p-4 min-w-[300px] rounded-lg shadow-lg border-l-4 
                            {% if message.tags == 'success' %} bg-emerald-50 border-emerald-500 text-emerald-800 
                            {% elif message.tags == 'error' %} bg-red-50 border-red-500 text-red-800 
                            {% else %} bg-blue-50 border-blue-500 text-blue-800 {% endif %}">
                            
                            <div class="ml-3 text-sm font-bold">
                                {{ message }}
                            </div>
                            
                            <button @click="show = false" class="ml-auto -mx-1.5 -my-1.5 p-1.5 inline-flex items-center justify-center h-8 w-8 hover:bg-opacity-20 hover:bg-black rounded-lg">
                                <span class="sr-only">Close</span>
                                <svg class="w-3 h-3" fill="none" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
                            </button>
                        </div>
                    {% endfor %}
                {% endif %}
            </div>
            {% block content %}
            <!-- This part will be replaced by other files -->
            {% endblock %}
        </main>
    </div>

    <!-- Mobile Overlay (Hidden by default) -->
    <div id="sidebarOverlay" class="fixed inset-0 z-40 bg-black/50 hidden sm:hidden"></div>

    <script>
        const btn = document.getElementById('drawerToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        btn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
